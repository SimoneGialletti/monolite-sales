<!doctype html>
<html lang="en" class="dark"><head><meta charset="utf-8"><title>Components · Card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--mono-bg);color:var(--mono-fg);font-family:var(--mono-font-sans);padding:24px 28px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .card{background:var(--mono-surface);border:1px solid var(--mono-border);padding:20px 22px;transition:transform 240ms cubic-bezier(.2,.8,.2,1),border-color 240ms,box-shadow 240ms;cursor:pointer;position:relative}
  .card:hover{transform:translateY(-2px);border-color:oklch(0.42 0 0);box-shadow:0 14px 32px -10px rgb(0 0 0 / 0.6)}
  .head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .pulse{position:relative;width:8px;height:8px;flex-shrink:0}
  .pulse::after{content:"";position:absolute;inset:-2px;border-radius:999px;background:var(--mono-live-soft);opacity:.6;animation:p 2.4s cubic-bezier(.2,.8,.2,1) infinite}
  .pulse::before{content:"";position:absolute;inset:0;border-radius:999px;background:var(--mono-live)}
  @keyframes p{0%{transform:scale(.7);opacity:.6}100%{transform:scale(2.8);opacity:0}}
  .title{font-family:var(--mono-font-display);font-size:18px;font-weight:400;letter-spacing:-0.018em}
  .meta{font-size:10.5px;color:var(--mono-fg-muted);font-family:var(--mono-font-mono);letter-spacing:0.04em;margin-left:auto}
  .body{font-size:13px;color:var(--mono-fg-muted);line-height:1.55;margin:0;max-width:42ch}
  .foot{margin-top:18px;padding-top:14px;border-top:1px solid var(--mono-border);font-size:11px;color:var(--mono-fg-muted);display:flex;justify-content:space-between;align-items:center}
  .foot .who{display:flex;align-items:center;gap:8px}
  .foot .who::before{content:"";display:inline-block;width:14px;height:14px;background:linear-gradient(135deg,oklch(0.66 0.13 55) 0%,oklch(0.4 0.04 55) 100%);}
  .num{font-family:var(--mono-font-display);font-size:30px;font-weight:400;letter-spacing:-0.025em;font-feature-settings:"tnum"}
  .num sup{font-family:var(--mono-font-sans);font-size:11px;color:var(--mono-fg-muted);font-weight:500;margin-left:6px;letter-spacing:0;vertical-align:6px}
  .stat{display:flex;flex-direction:column;gap:4px}
  .stat .lab{font-size:10px;font-family:var(--mono-font-mono);letter-spacing:0.1em;text-transform:uppercase;color:var(--mono-fg-muted)}
</style></head>
<body>
<div class="grid">
  <div class="card">
    <div class="head"><span class="pulse"></span><span class="title">billing-monthly</span><span class="meta">ACME-142</span></div>
    <p class="body">Reconciliation in progress. Twelve of thirty-eight invoices matched against bank movements.</p>
    <div class="foot"><span class="who">Studio Adriatica</span><span>4m ago</span></div>
  </div>
  <div class="card">
    <div class="stat" style="margin-bottom:18px">
      <span class="lab">Run time / month</span>
      <span class="num">142<sup>h</sup></span>
    </div>
    <p class="body">Across seven active agents and three companies. Down 8% from last month after dedupe.</p>
    <div class="foot"><span>All companies</span><span>Apr 2026</span></div>
  </div>
</div>
</body></html>
