<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Colors · Neutrals (light)</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;color:#0e0e0e;font-family:var(--mono-font-sans);font-size:11px}
  .row{display:flex;height:150px}
  .sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;border-right:1px solid #e8e8e8}
  .sw:last-child{border-right:none}
  .name{font-weight:600;letter-spacing:-0.01em}
  .val{color:#0e0e0e99;font-family:var(--mono-font-mono)}
</style></head>
<body>
<div class="row">
  <div class="sw" style="background:oklch(1 0 0)"><div class="name">bg</div><div class="val">1.000</div></div>
  <div class="sw" style="background:oklch(0.985 0 0)"><div class="name">sidebar</div><div class="val">0.985</div></div>
  <div class="sw" style="background:oklch(0.97 0 0)"><div class="name">secondary</div><div class="val">0.970</div></div>
  <div class="sw" style="background:oklch(0.922 0 0)"><div class="name">border</div><div class="val">0.922</div></div>
  <div class="sw" style="background:oklch(0.708 0 0);color:#fff"><div class="name" style="color:#fff">ring</div><div class="val" style="color:#fffc">0.708</div></div>
  <div class="sw" style="background:oklch(0.556 0 0);color:#fff"><div class="name" style="color:#fff">muted-fg</div><div class="val" style="color:#fffc">0.556</div></div>
  <div class="sw" style="background:oklch(0.205 0 0);color:#fff"><div class="name" style="color:#fff">primary</div><div class="val" style="color:#fffc">0.205</div></div>
  <div class="sw" style="background:oklch(0.145 0 0);color:#fff"><div class="name" style="color:#fff">fg</div><div class="val" style="color:#fffc">0.145</div></div>
</div>
</body></html>
