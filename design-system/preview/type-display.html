<!doctype html>
<html lang="en" class="dark"><head><meta charset="utf-8"><title>Type · Display — Reckless Standard</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--mono-bg);color:var(--mono-fg);font-family:var(--mono-font-sans);padding:18px 22px}
  .label{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--mono-fg-muted)}
  .label b{color:var(--mono-fg);font-weight:500;letter-spacing:0.04em}
  .row{display:flex;align-items:baseline;gap:18px;padding:6px 0;border-bottom:1px dashed var(--mono-border)}
  .row:last-child{border-bottom:none}
  .meta{font-family:var(--mono-font-mono);font-size:10px;color:var(--mono-fg-muted);width:74px;flex-shrink:0;letter-spacing:0.02em}
  .sample{font-family:var(--mono-font-display);line-height:1.05;letter-spacing:-0.018em}
</style></head>
<body>
  <div class="label"><b>Reckless Standard</b><span>Display · serif</span></div>
  <div class="row"><span class="meta">52 · 400</span><span class="sample" style="font-size:46px;font-weight:400">Monolite</span></div>
  <div class="row"><span class="meta">36 · 400</span><span class="sample" style="font-size:32px;font-weight:400">The rails for agentic work.</span></div>
  <div class="row"><span class="meta">28 · 400i</span><span class="sample" style="font-size:24px;font-weight:400;font-style:italic;letter-spacing:-0.01em">Strutture che suscitano ammirazione</span></div>
  <div class="row"><span class="meta">22 · 500</span><span class="sample" style="font-size:20px;font-weight:500;letter-spacing:-0.01em">Per-company data isolation</span></div>
  <div class="row"><span class="meta">18 · 350</span><span class="sample" style="font-size:16px;font-weight:350;letter-spacing:0">Book weight — the body of the editorial pair</span></div>
</body></html>
