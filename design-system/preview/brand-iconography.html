<!doctype html>
<html lang="en" class="dark"><head><meta charset="utf-8"><title>Brand · Iconography</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--mono-bg);color:var(--mono-fg);font-family:var(--mono-font-sans);padding:32px 36px}
  .meta{display:flex;align-items:baseline;gap:24px;margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--mono-border)}
  h2{margin:0;font-family:var(--mono-font-display);font-size:26px;font-weight:400;letter-spacing:-0.022em}
  h2 em{color:var(--mono-fg-muted);font-style:italic;font-weight:300}
  .spec{font-family:var(--mono-font-mono);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--mono-fg-muted);display:flex;gap:18px;margin-left:auto}
  .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:0;border:1px solid var(--mono-border);border-right:0;border-bottom:0}
  .ic{aspect-ratio:1;display:flex;align-items:center;justify-content:center;color:var(--mono-fg-muted);transition:color 240ms cubic-bezier(.2,.8,.2,1),background 240ms;border-right:1px solid var(--mono-border);border-bottom:1px solid var(--mono-border);position:relative}
  .ic:hover{color:var(--mono-fg);background:oklch(1 0 0 / .025)}
  .ic svg{width:16px;height:16px;stroke-width:1.75}
  .lab{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-family:var(--mono-font-mono);font-size:8px;letter-spacing:0.06em;color:var(--mono-fg-muted);opacity:0;transition:opacity 220ms}
  .ic:hover .lab{opacity:.6}
  .note{margin-top:24px;font-size:11.5px;color:var(--mono-fg-muted);font-family:var(--mono-font-mono);letter-spacing:0.06em;display:flex;gap:24px}
  .note span::before{content:"·";margin-right:6px;color:var(--mono-fg);opacity:.4}
</style></head>
<body>
<div class="meta">
  <h2>Lucide, <em>set sparingly.</em></h2>
  <div class="spec"><span>1.75 stroke</span><span>16px canonical</span><span>currentColor</span></div>
</div>
<div class="grid">
  <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg><span class="lab">dashboard</span></div>
  <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg><span class="lab">inbox</span></div>
  <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="1"/></svg><span class="lab">issue</span></div>
  <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg><span class="lab">target</span></div>
  <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><span class="lab">history</span></div>
  <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="10" r="3"/><circle cx="19" cy="6" r="3"/><circle cx="5" cy="6" r="3"/><circle cx="12" cy="20" r="3"/><line x1="12" y1="13" x2="12" y2="17"/><line x1="14.5" y1="8" x2="16.5" y2="7"/><line x1="9.5" y1="8" x2="7.5" y2="7"/></svg><span class="lab">network</span></div>
  <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><span class="lab">search</span></div>
  <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg><span class="lab">edit</span></div>
  <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><polyline points="21 3 21 8 16 8"/></svg><span class="lab">refresh</span></div>
  <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 14 4-4 4 4 5-5"/></svg><span class="lab">trend</span></div>
  <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg><span class="lab">agent</span></div>
  <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span class="lab">settings</span></div>
</div>
<div class="note">
  <span>Lucide v0.511</span><span>16/20/24px sizes</span><span>Never filled</span><span>Never colored — they take their color from text</span>
</div>
</body></html>
