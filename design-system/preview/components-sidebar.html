<!doctype html>
<html lang="en" class="dark"><head><meta charset="utf-8"><title>Components · Sidebar nav</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--mono-bg);color:var(--mono-fg);font-family:var(--mono-font-sans);padding:24px 28px;font-size:13px}
  .nav{display:flex;flex-direction:column;gap:1px;width:248px}
  .item{display:flex;align-items:center;gap:11px;padding:8px 14px;font-size:13px;font-weight:500;color:var(--mono-fg-muted);transition:color 220ms cubic-bezier(.2,.8,.2,1),background 220ms cubic-bezier(.2,.8,.2,1);cursor:pointer;letter-spacing:-0.005em;position:relative;border-left:2px solid transparent}
  .item svg{width:15px;height:15px;flex-shrink:0;stroke-width:1.75}
  .item:hover{color:var(--mono-fg)}
  .item.active{color:var(--mono-fg);border-left-color:var(--mono-fg)}
  .item.active::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,oklch(1 0 0 / .04) 0%,transparent 100%);pointer-events:none}
  .badge{margin-left:auto;font-size:10px;font-family:var(--mono-font-mono);padding:1px 6px;color:var(--mono-fg-muted);letter-spacing:0.04em;font-feature-settings:"tnum"}
  .badge.danger{background:var(--mono-danger);color:#fff;font-family:var(--mono-font-sans);font-weight:600;border-radius:999px;min-width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;font-size:9.5px}
  .label{font-size:9.5px;text-transform:uppercase;letter-spacing:0.14em;color:var(--mono-fg-muted);padding:18px 14px 6px;font-weight:500;font-family:var(--mono-font-mono)}
  .kbd{font-size:9.5px;font-family:var(--mono-font-mono);color:var(--mono-fg-muted);opacity:.5;letter-spacing:0;margin-left:auto}
</style></head>
<body>
<div class="nav">
  <div class="item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>Dashboard<span class="kbd">G D</span></div>

  <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="1"/></svg>Issues</div>

  <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Settings</div>
</div>
</body></html>
