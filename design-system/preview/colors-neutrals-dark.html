<!doctype html>
<html lang="en" class="dark"><head><meta charset="utf-8"><title>Colors · Neutrals (dark)</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--mono-bg);color:var(--mono-fg);font-family:var(--mono-font-sans);font-size:11px}
  .row{display:flex;height:150px}
  .sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;border-right:1px solid var(--mono-border)}
  .sw:last-child{border-right:none}
  .name{color:var(--mono-fg);font-weight:600;letter-spacing:-0.01em}
  .val{color:var(--mono-fg-muted);font-family:var(--mono-font-mono)}
</style></head>
<body>
<div class="row">
  <div class="sw" style="background:oklch(0.145 0 0)"><div class="name">bg</div><div class="val">0.145</div></div>
  <div class="sw" style="background:oklch(0.205 0 0)"><div class="name">surface</div><div class="val">0.205</div></div>
  <div class="sw" style="background:oklch(0.269 0 0)"><div class="name">secondary</div><div class="val">0.269</div></div>
  <div class="sw" style="background:oklch(0.439 0 0)"><div class="name">ring</div><div class="val">0.439</div></div>
  <div class="sw" style="background:oklch(0.708 0 0);color:#000"><div class="name" style="color:#000">muted-fg</div><div class="val" style="color:#000c">0.708</div></div>
  <div class="sw" style="background:oklch(0.985 0 0);color:#000"><div class="name" style="color:#000">fg</div><div class="val" style="color:#000c">0.985</div></div>
</div>
</body></html>
