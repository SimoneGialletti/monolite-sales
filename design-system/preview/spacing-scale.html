<!doctype html>
<html lang="en" class="dark"><head><meta charset="utf-8"><title>Spacing · 4px scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--mono-bg);color:var(--mono-fg);font-family:var(--mono-font-sans);padding:16px 20px}
  .row{display:flex;align-items:center;gap:10px;height:18px}
  .bar{height:8px;background:var(--mono-fg)}
  .lbl{font-family:var(--mono-font-mono);font-size:10px;color:var(--mono-fg-muted);width:42px}
</style></head>
<body>
  <div class="row"><span class="lbl">4</span><span class="bar" style="width:4px"></span></div>
  <div class="row"><span class="lbl">8</span><span class="bar" style="width:8px"></span></div>
  <div class="row"><span class="lbl">12</span><span class="bar" style="width:12px"></span></div>
  <div class="row"><span class="lbl">16</span><span class="bar" style="width:16px"></span></div>
  <div class="row"><span class="lbl">24</span><span class="bar" style="width:24px"></span></div>
  <div class="row"><span class="lbl">32</span><span class="bar" style="width:32px"></span></div>
  <div class="row"><span class="lbl">48</span><span class="bar" style="width:48px"></span></div>
  <div class="row"><span class="lbl">72</span><span class="bar" style="width:72px"></span></div>
  <div class="row"><span class="lbl">240</span><span class="bar" style="width:240px"></span></div>
</body></html>
