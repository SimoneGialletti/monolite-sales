<!doctype html>
<html lang="en" class="dark"><head><meta charset="utf-8"><title>Type · UI scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--mono-bg);color:var(--mono-fg);font-family:var(--mono-font-sans);padding:14px 20px}
  .row{display:flex;align-items:baseline;gap:16px;padding:5px 0}
  .meta{font-family:var(--mono-font-mono);font-size:10px;color:var(--mono-fg-muted);width:90px;flex-shrink:0}
  .upper{font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
  .nav{font-size:13px;font-weight:500}
  .body{font-size:15px;line-height:1.6}
  .meta-s{font-size:12px;color:var(--mono-fg-muted)}
  .xs{font-size:11px;color:var(--mono-fg-muted)}
  kbd{font-family:var(--mono-font-mono);font-size:11px;border:1px solid var(--mono-border);padding:1px 5px;border-radius:4px;background:var(--mono-secondary)}
</style></head>
<body>
  <div class="row"><span class="meta">14 · 600 UPPER</span><span class="upper">Dashboard</span></div>
  <div class="row"><span class="meta">15 · 400</span><span class="body">An agent is a configuration plus a runtime.</span></div>
  <div class="row"><span class="meta">13 · 500 (nav)</span><span class="nav">New Issue · Inbox · Agents</span></div>
  <div class="row"><span class="meta">12 · 400</span><span class="meta-s">Updated 4m ago by Studio Adriatica</span></div>
  <div class="row"><span class="meta">11 · 400</span><span class="xs">Press <kbd>⌘K</kbd> for commands</span></div>
</body></html>
