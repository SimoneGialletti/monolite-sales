<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Colors · Dune (marketing)</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--mono-paper);color:#1a140d;font-family:var(--mono-font-sans);font-size:11px}
  .row{display:flex;height:150px}
  .sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:12px}
  .name{font-weight:600;letter-spacing:-0.01em}
  .val{font-family:var(--mono-font-mono);opacity:.7;margin-top:2px}
</style></head>
<body>
<div class="row">
  <div class="sw" style="background:var(--mono-paper)"><div class="name">paper</div><div class="val">0.965 · 80°</div></div>
  <div class="sw" style="background:var(--mono-sand)"><div class="name">sand</div><div class="val">0.86 · 80°</div></div>
  <div class="sw" style="background:var(--mono-spice);color:#fff"><div class="name">spice</div><div class="val">0.66 · 55°</div></div>
  <div class="sw" style="background:var(--mono-stone);color:#fff"><div class="name">stone</div><div class="val">0.55 · 60°</div></div>
  <div class="sw" style="background:var(--mono-obsidian);color:#fff"><div class="name">obsidian</div><div class="val">0.16 · 260°</div></div>
</div>
</body></html>
