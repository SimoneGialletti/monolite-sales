<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <title>Monolite — Platform UI Kit</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../colors_and_type.css">
  <style>
    html,body,#root{height:100%;margin:0;background:var(--mono-bg);color:var(--mono-fg);font-family:var(--mono-font-sans);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
    *{box-sizing:border-box}
    button{font:inherit;color:inherit}
    a{color:inherit;text-decoration:none}
    @keyframes monoPulse {
      0%   { transform: scale(1);   opacity: 0.55; }
      70%  { transform: scale(2.6); opacity: 0; }
      100% { transform: scale(2.6); opacity: 0; }
    }
    @keyframes monoFadeUp {
      0%   { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    /* Ambient backdrop — extremely subtle */
    body::before {
      content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
      background:
        radial-gradient(1200px 600px at 80% -10%, color-mix(in oklch, var(--mono-spice) 8%, transparent), transparent 60%),
        radial-gradient(900px 500px at -10% 110%, color-mix(in oklch, var(--mono-live) 5%, transparent), transparent 55%);
    }
    #root { position: relative; z-index: 1; }
    ::selection { background: var(--mono-fg); color: var(--mono-bg); }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: var(--mono-border); border-radius: 999px; border: 2px solid transparent; background-clip: content-box; }
    ::-webkit-scrollbar-thumb:hover { background: var(--mono-ring); background-clip: content-box; border: 2px solid transparent; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="Icons.jsx"></script>
  <script type="text/babel" src="CompanyRail.jsx"></script>
  <script type="text/babel" src="Sidebar.jsx"></script>
  <script type="text/babel" src="BreadcrumbBar.jsx"></script>
  <script type="text/babel" src="Dashboard.jsx"></script>
  <script type="text/babel" src="IssueDialog.jsx"></script>
  <script type="text/babel" src="Shell.jsx"></script>
  <script type="text/babel">
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Shell />);
  </script>
</body>
</html>
